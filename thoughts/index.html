<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thoughts - Bader Fayyumi</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../styles.css?v=20261124-6">
    <script src="../nav-hand.js?v=20261124-4" defer></script>
    <script>
        // Visits from another page of the site write in faster, and a page loaded ahead of time waits to animate until it's shown.
        (() => {
            const root = document.documentElement;
            try {
                if (document.referrer && new URL(document.referrer).origin === location.origin) root.classList.add('from-site');
            } catch {}
            if (document.prerendering) {
                root.classList.add('is-prerendering');
                document.addEventListener('prerenderingchange', () => root.classList.remove('is-prerendering'), { once: true });
            }
        })();
    </script>
    <!-- Load the other pages as soon as the visitor points at them in the nav, so switching is instant. -->
    <script type="speculationrules">
    {
        "prefetch": [{ "where": { "selector_matches": ".nav-container a" }, "eagerness": "eager" }],
        "prerender": [{ "where": { "selector_matches": ".nav-container a" }, "eagerness": "moderate" }]
    }
    </script>
</head>
